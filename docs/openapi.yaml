openapi: 3.1.0
info:
  title: Биржа обмена лагерями — API
  description: "\nДемо-версия API-сервиса **биржи обмена лагерями** для участников Школы Фонда Потанина\n(учебный проект НИУ\
    \ ВШЭ, не официальный сервис фонда).\n\nЛагеря — настоящий список сезона 2026 (даты перенесены на 2027 год), участники\
    \ и сотрудники вымышленные.\nДанные хранятся в памяти; `POST /api/v1/demo/reset` возвращает их в исходное состояние.\n\
    \n**Авторизация (заглушка).** В полной системе пользователь входит по одноразовому коду и получает токен.\nЗдесь пользователь\
    \ передаётся заголовком `X-User-Id` — в каждом запросе его можно выбрать из списка:\n\n| X-User-Id | Кто это |\n|---|---|\n\
    | `p004` | Григорий Павлов, участник (Пасвик), заявки ещё нет |\n| `p001` | Анна Лебедева, участница (Кижи) |\n| `p002`\
    \ | Борис Ковалёв, участник (Валдайский) |\n| `p003` | Виктория Зайцева, участница (Забайкальский) |\n| `p005` | Дмитрий\
    \ Соколов, участник (Красноярские Столбы) |\n| `p006` | Евгения Морозова, участница (Земля леопарда) |\n| `approver1`\
    \ | Марина Волкова, согласующий фонда |\n| `curator1` | Олег Тарасов, куратор лагерей 1–31 |\n| `leader1` | Дарья Кузнецова,\
    \ кэмп-лидер (Валдайский, Кижи) |\n| `coord1` | Николай Сергеев, координатор (Кижи) |\n\n**Сценарий проверки — обмен по\
    \ цепочке из четырёх человек:**\n1. `PUT /api/v1/me/request` от `p004` с телом `{\"wishes\": [8, 17]}` — Гриша хочет в\
    \ Кижи. Подбор запускается сразу и находит цепочку\n   Кижи → Валдайский → Забайкальский → Пасвик (`active_swap_id` в\
    \ ответе; после сброса стенда это обмен №14).\n2. `PATCH /api/v1/swaps/{id}/members/me` с `{\"response\": \"accepted\"\
    }` от `p001`, `p002`, `p003`, `p004` — обмен переходит в `confirmed`.\n3. `POST /api/v1/swaps/{id}/decision` от `approver1`\
    \ с `{\"decision\": \"approve\"}` — лагеря меняются у всех четверых сразу.\n4. `GET /api/v1/camps/8/roster` от `leader1`\
    \ или `coord1` — в Кижи теперь Григорий; `GET /api/v1/me/notifications` — какие уведомления ушли.\n\nОбмен №1 (p005 ↔\
    \ p006) с самого начала ждёт ответа участников, обмен №2 (p007 ↔ p008) — решения фонда.\n"
  version: 1.0.0
paths:
  /api/v1/camps:
    get:
      tags:
      - Лагеря
      summary: Каталог лагерей сезона
      description: 'Лагеря текущего сезона со спросом: сколько участников хотят уйти и сколько — попасть в лагерь.'
      operationId: list_camps
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Поиск по названию
          title: Q
        description: Поиск по названию
      - name: region
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Фильтр по региону, точное совпадение
          title: Region
        description: Фильтр по региону, точное совпадение
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampCatalogItem'
                title: Response List Camps
        '422':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorOut'
  /api/v1/camps/{camp_id}/roster:
    get:
      tags:
      - Лагеря
      summary: Актуальный состав лагеря
      description: 'Состав лагеря для команды лагеря и сотрудников фонда. Набор полей зависит от роли:

        кэмп-лидеру — контакты для связи с группой, координатору — данные для пропусков.'
      operationId: camp_roster
      parameters:
      - name: camp_id
        in: path
        required: true
        schema:
          type: integer
          description: id лагеря
          examples:
          - 8
          title: Camp Id
        description: id лагеря
      - name: X-User-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Демо-пользователь
          title: X-User-Id
        description: Демо-пользователь
        examples:
          leader1:
            summary: leader1 — Дарья Кузнецова, кэмп-лидер (Валдайский, Кижи)
            value: leader1
          coord1:
            summary: coord1 — Николай Сергеев, координатор (Кижи)
            value: coord1
          curator1:
            summary: curator1 — Олег Тарасов, куратор лагерей 1–31
            value: curator1
          p004:
            summary: p004 — Григорий Павлов, участник (Пасвик), заявки ещё нет
            value: p004
          p001:
            summary: p001 — Анна Лебедева, участница (Кижи)
            value: p001
          p002:
            summary: p002 — Борис Ковалёв, участник (Валдайский)
            value: p002
          p003:
            summary: p003 — Виктория Зайцева, участница (Забайкальский)
            value: p003
          p005:
            summary: p005 — Дмитрий Соколов, участник (Красноярские Столбы)
            value: p005
          p006:
            summary: p006 — Евгения Морозова, участница (Земля леопарда)
            value: p006
          approver1:
            summary: approver1 — Марина Волкова, согласующий фонда
            value: approver1
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Roster'
        '401':
          description: Пользователь не передан или неизвестен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт с текущим состоянием
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorOut'
  /api/v1/me:
