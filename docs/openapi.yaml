      tags:
      - Участник
      summary: Мои уведомления
      description: Что сервис уведомлений отправил пользователю во ВКонтакте или на email (в демо — журнал отправки).
      operationId: my_notifications
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: X-User-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Демо-пользователь
          title: X-User-Id
        description: Демо-пользователь
        examples:
          p004:
            summary: p004 — Григорий Павлов, участник (Пасвик), заявки ещё нет
            value: p004
          leader1:
            summary: leader1 — Дарья Кузнецова, кэмп-лидер (Валдайский, Кижи)
            value: leader1
          approver1:
            summary: approver1 — Марина Волкова, согласующий фонда
            value: approver1
          p001:
            summary: p001 — Анна Лебедева, участница (Кижи)
            value: p001
          p002:
            summary: p002 — Борис Ковалёв, участник (Валдайский)
            value: p002
          p003:
            summary: p003 — Виктория Зайцева, участница (Забайкальский)
            value: p003
          p005:
            summary: p005 — Дмитрий Соколов, участник (Красноярские Столбы)
            value: p005
          p006:
            summary: p006 — Евгения Морозова, участница (Земля леопарда)
            value: p006
          curator1:
            summary: curator1 — Олег Тарасов, куратор лагерей 1–31
            value: curator1
          coord1:
            summary: coord1 — Николай Сергеев, координатор (Кижи)
            value: coord1
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationOut'
                title: Response My Notifications
        '401':
          description: Пользователь не передан или неизвестен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт с текущим состоянием
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorOut'
  /api/v1/swaps:
    get:
      tags:
      - Обмены
      summary: Список обменов
      description: Участник видит свои обмены, согласующий — все, кураторы и команды лагерей — обмены своих лагерей.
      operationId: list_swaps
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - proposed
            - confirmed
            - approved
            - declined
            - expired
            - rejected
            type: string
          - type: 'null'
          description: Фильтр по статусу; очередь фонда — confirmed
          title: Status
        description: Фильтр по статусу; очередь фонда — confirmed
      - name: X-User-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Демо-пользователь
          title: X-User-Id
        description: Демо-пользователь
        examples:
          approver1:
            summary: approver1 — Марина Волкова, согласующий фонда
            value: approver1
          p001:
            summary: p001 — Анна Лебедева, участница (Кижи)
            value: p001
          curator1:
            summary: curator1 — Олег Тарасов, куратор лагерей 1–31
            value: curator1
          p004:
            summary: p004 — Григорий Павлов, участник (Пасвик), заявки ещё нет
            value: p004
          p002:
            summary: p002 — Борис Ковалёв, участник (Валдайский)
            value: p002
          p003:
            summary: p003 — Виктория Зайцева, участница (Забайкальский)
            value: p003
          p005:
            summary: p005 — Дмитрий Соколов, участник (Красноярские Столбы)
            value: p005
          p006:
            summary: p006 — Евгения Морозова, участница (Земля леопарда)
            value: p006
          leader1:
            summary: leader1 — Дарья Кузнецова, кэмп-лидер (Валдайский, Кижи)
            value: leader1
          coord1:
            summary: coord1 — Николай Сергеев, координатор (Кижи)
            value: coord1
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Swap'
                title: Response List Swaps
        '401':
          description: Пользователь не передан или неизвестен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт с текущим состоянием
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorOut'
    post:
      tags:
      - Обмены
      summary: Оформить обмен, о котором участники договорились сами
      description: 'Инициатор указывает, кто в какой лагерь переходит. Обмен должен быть замкнут:

        каждый лагерь отдаётся и получается ровно один раз. Остальные участники получают приглашение

        и подтверждают его так же, как найденный автоматически.'
      operationId: create_manual_swap
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Демо-пользователь
          title: X-User-Id
        description: Демо-пользователь
        examples:
          p001:
            summary: p001 — Анна Лебедева, участница (Кижи)
            value: p001
          p004:
            summary: p004 — Григорий Павлов, участник (Пасвик), заявки ещё нет
            value: p004
          p002:
            summary: p002 — Борис Ковалёв, участник (Валдайский)
            value: p002
          p003:
            summary: p003 — Виктория Зайцева, участница (Забайкальский)
            value: p003
          p005:
            summary: p005 — Дмитрий Соколов, участник (Красноярские Столбы)
            value: p005
          p006:
            summary: p006 — Евгения Морозова, участница (Земля леопарда)
            value: p006
          approver1:
            summary: approver1 — Марина Волкова, согласующий фонда
            value: approver1
          curator1:
            summary: curator1 — Олег Тарасов, куратор лагерей 1–31
            value: curator1
          leader1:
            summary: leader1 — Дарья Кузнецова, кэмп-лидер (Валдайский, Кижи)
            value: leader1
          coord1:
            summary: coord1 — Николай Сергеев, координатор (Кижи)
            value: coord1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualSwapIn'
            examples:
              pair:
                summary: Анна (Кижи) и Борис (Валдайский) меняются
                value:
