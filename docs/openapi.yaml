components:
  schemas:
    Camp:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        region:
          type: string
          title: Region
        start_date:
          type: string
          format: date
          title: Start Date
        end_date:
          type: string
          format: date
          title: End Date
      type: object
      required:
      - id
      - name
      - region
      - start_date
      - end_date
      title: Camp
    CampCatalogItem:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        region:
          type: string
          title: Region
        start_date:
          type: string
          format: date
          title: Start Date
        end_date:
          type: string
          format: date
          title: End Date
        participants:
          type: integer
          title: Participants
          description: Сколько участников сейчас распределено в лагерь
        want_to_leave:
          type: integer
          title: Want To Leave
          description: Сколько участников лагеря подали заявку на обмен
        want_to_join:
          type: integer
          title: Want To Join
          description: В скольких активных заявках лагерь указан среди желаемых
      type: object
      required:
      - id
      - name
      - region
      - start_date
      - end_date
      - participants
      - want_to_leave
      - want_to_join
      title: CampCatalogItem
    Contacts:
      properties:
        email:
          type: string
          title: Email
        vk_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Vk Id
      type: object
      required:
      - email
      - vk_id
      title: Contacts
    DecisionIn:
      properties:
        decision:
          type: string
          enum:
          - approve
          - reject
          title: Decision
        comment:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Comment
          description: Обязателен при отклонении
      type: object
      required:
      - decision
      title: DecisionIn
    Error:
      properties:
        detail:
          type: string
          title: Detail
          description: Описание ошибки на русском языке
      type: object
      required:
      - detail
      title: Error
    FieldError:
      properties:
        field:
          description: Поле запроса, например body.wishes
          title: Field
          type: string
        message:
          title: Message
          type: string
      required:
      - field
      - message
      title: FieldError
      type: object
    HistoryItem:
      properties:
        at:
          type: string
          format: date-time
          title: At
        actor:
          type: string
          title: Actor
        action:
          type: string
          title: Action
        details:
          type: string
          title: Details
      type: object
      required:
      - at
      - actor
      - action
      - details
      title: HistoryItem
    ManualSwapIn:
      properties:
        members:
          items:
            $ref: '#/components/schemas/MoveIn'
          type: array
          maxItems: 4
          minItems: 2
          title: Members
          description: Кто в какой лагерь переходит; инициатор (X-User-Id) должен быть в списке
      type: object
      required:
      - members
      title: ManualSwapIn
    MatchingRun:
      properties:
        trigger:
          type: string
          title: Trigger
        started_at:
          type: string
          format: date-time
          title: Started At
        expired_swap_ids:
          items:
            type: integer
          type: array
          title: Expired Swap Ids
          description: Предложения, снятые по истечении срока ответа
        active_requests:
          type: integer
          title: Active Requests
        graph_edges:
          type: integer
          title: Graph Edges
        cycles_found:
