                    to_camp_id: 7
                  - participant_id: p002
                    to_camp_id: 8
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Swap'
        '401':
          description: Пользователь не передан или неизвестен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт с текущим состоянием
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorOut'
