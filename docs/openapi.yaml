      operationId: get_me
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Демо-пользователь
          title: X-User-Id
        description: Демо-пользователь
        examples:
          p004:
            summary: p004 — Григорий Павлов, участник (Пасвик), заявки ещё нет
            value: p004
          p001:
            summary: p001 — Анна Лебедева, участница (Кижи)
            value: p001
          p002:
            summary: p002 — Борис Ковалёв, участник (Валдайский)
            value: p002
          p003:
            summary: p003 — Виктория Зайцева, участница (Забайкальский)
            value: p003
          p005:
            summary: p005 — Дмитрий Соколов, участник (Красноярские Столбы)
            value: p005
          p006:
            summary: p006 — Евгения Морозова, участница (Земля леопарда)
            value: p006
          approver1:
            summary: approver1 — Марина Волкова, согласующий фонда
            value: approver1
          curator1:
            summary: curator1 — Олег Тарасов, куратор лагерей 1–31
            value: curator1
          leader1:
            summary: leader1 — Дарья Кузнецова, кэмп-лидер (Валдайский, Кижи)
            value: leader1
          coord1:
            summary: coord1 — Николай Сергеев, координатор (Кижи)
            value: coord1
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Пользователь не передан или неизвестен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт с текущим состоянием
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorOut'
  /api/v1/me/request:
    put:
      tags:
      - Участник
      summary: Создать или изменить заявку на обмен
      description: 'Участник указывает до 5 лагерей по приоритету. Заявка сразу участвует в подборе:

        после сохранения запускается сервис подбора (в полной системе — по событию `offer.changed` из брокера).

        Если обмен нашёлся, в ответе будет `status: in_swap` и `active_swap_id`.'
      operationId: put_request
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Демо-пользователь
          title: X-User-Id
        description: Демо-пользователь
        examples:
          p004:
            summary: p004 — Григорий Павлов, участник (Пасвик), заявки ещё нет
            value: p004
          p001:
            summary: p001 — Анна Лебедева, участница (Кижи)
            value: p001
          p002:
            summary: p002 — Борис Ковалёв, участник (Валдайский)
            value: p002
          p003:
            summary: p003 — Виктория Зайцева, участница (Забайкальский)
            value: p003
          p005:
            summary: p005 — Дмитрий Соколов, участник (Красноярские Столбы)
            value: p005
          p006:
            summary: p006 — Евгения Морозова, участница (Земля леопарда)
            value: p006
          approver1:
            summary: approver1 — Марина Волкова, согласующий фонда
            value: approver1
          curator1:
            summary: curator1 — Олег Тарасов, куратор лагерей 1–31
            value: curator1
          leader1:
            summary: leader1 — Дарья Кузнецова, кэмп-лидер (Валдайский, Кижи)
            value: leader1
          coord1:
            summary: coord1 — Николай Сергеев, координатор (Кижи)
            value: coord1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestIn'
            examples:
              chain:
                summary: Гриша (p004) хочет в Кижи — замыкает цепочку
                value:
                  wishes:
                  - 8
                  - 17
              several:
                summary: Несколько лагерей по приоритету
                value:
                  wishes:
                  - 12
                  - 28
                  - 54
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestOut'
        '401':
          description: Пользователь не передан или неизвестен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт с текущим состоянием
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '201':
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestOut'
        '422':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorOut'
    delete:
      tags:
      - Участник
      summary: Отозвать заявку
      description: Заявку можно отозвать, пока она не входит в предложенный обмен.
      operationId: delete_request
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Демо-пользователь
          title: X-User-Id
        description: Демо-пользователь
        examples:
          p001:
            summary: p001 — Анна Лебедева, участница (Кижи)
            value: p001
          p004:
            summary: p004 — Григорий Павлов, участник (Пасвик), заявки ещё нет
            value: p004
          p002:
            summary: p002 — Борис Ковалёв, участник (Валдайский)
            value: p002
          p003:
            summary: p003 — Виктория Зайцева, участница (Забайкальский)
            value: p003
          p005:
            summary: p005 — Дмитрий Соколов, участник (Красноярские Столбы)
            value: p005
          p006:
            summary: p006 — Евгения Морозова, участница (Земля леопарда)
            value: p006
          approver1:
            summary: approver1 — Марина Волкова, согласующий фонда
            value: approver1
          curator1:
            summary: curator1 — Олег Тарасов, куратор лагерей 1–31
            value: curator1
          leader1:
            summary: leader1 — Дарья Кузнецова, кэмп-лидер (Валдайский, Кижи)
            value: leader1
          coord1:
            summary: coord1 — Николай Сергеев, координатор (Кижи)
            value: coord1
      responses:
        '204':
          description: Успешный ответ
        '401':
          description: Пользователь не передан или неизвестен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт с текущим состоянием
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorOut'
  /api/v1/me/notifications:
